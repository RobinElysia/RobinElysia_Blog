# ============================================
# RobinElysia Blog — Docker Compose（生产）
# 用法：
#   1. 修改 .env 中的生产值（SITE_URL/AUTH_SECRET/密码/PROD_DOMAIN）
#   2. docker compose up -d --build
#   3. Caddy 自动 HTTPS：访问 https://你的域名（80/443 需可达）
#   本地测试：PROD_HTTP_PORT=3080 PROD_HTTPS_PORT=3443 docker compose up -d --build
#
# v0.19.9：environment 插值改用 PROD_* 变量名——
#   踩坑记录：compose 插值优先读 shell 环境变量，本机终端会话残留旧值
#   （ADMIN_PASSWORD=robinelysia-admin 等）压过 .env；且 desktop 版 env_file 失效。
#   PROD_* 前缀保证不与任何 shell 残留冲突，值始终来自 .env。
# v0.21.1：内置 Caddy 反向代理 + 自动 HTTPS（Let's Encrypt）——
#   app 不再暴露宿主机端口（compose 内网由 Caddy 访问），SSL 全权交给 Caddy。
# ============================================

services:
  # 应用（Next.js，standalone 运行时）
  app:
    build:
      context: .
      # 国内服务器构建慢/超时：.env 设 PROD_NPM_REGISTRY=https://registry.npmmirror.com
      args:
        NPM_REGISTRY: ${PROD_NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    environment:
      SITE_URL: ${PROD_SITE_URL:?请在 .env 设置 PROD_SITE_URL}
      AUTH_SECRET: ${PROD_AUTH_SECRET:?请在 .env 设置 PROD_AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      ADMIN_USERNAME: ${PROD_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${PROD_ADMIN_PASSWORD:?请在 .env 设置 PROD_ADMIN_PASSWORD}
      DATABASE_URL: ${PROD_DATABASE_URL:?请在 .env 设置 PROD_DATABASE_URL}
      AUTH_GITHUB_ID: ${PROD_AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${PROD_AUTH_GITHUB_SECRET:-}
      # GitHub 登录白名单（逗号分隔用户名/邮箱，留空 = 拒绝所有 GitHub 登录）
      AUTH_GITHUB_ALLOWED_USERS: ${PROD_AUTH_GITHUB_ALLOWED_USERS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 数据库（PostgreSQL 16，首次启动按 .env 初始化）
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PROD_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:?请在 .env 设置 PROD_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PROD_POSTGRES_DB:-blog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 生产建议：不对外暴露 5432（app 通过 compose 内网访问）
    # ports:
    #   - "5432:5432"

  # Caddy 反向代理 + 自动 HTTPS（Let's Encrypt 自动申请/续期）
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
      - "${PROD_HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${PROD_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # 证书与私钥持久化（不丢证书、不反复签发）
      - caddy_config:/config
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  caddy_data:
  caddy_config:
